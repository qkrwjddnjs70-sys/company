<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>미니 카트 대소동</title>
<style>
  :root{
    --bg1:#0b1024; --bg2:#1b1140; --panel:#151a33cc; --panel-border:#4c5aa6;
    --accent:#ffd23f; --accent2:#ff5da2; --accent3:#3ddc97; --text:#eef1ff; --sub:#a9b3e8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:radial-gradient(1200px 800px at 50% -10%, #2a2560 0%, var(--bg1) 55%, #05060f 100%);
    font-family:"Trebuchet MS","Apple SD Gothic Neo","Malgun Gothic",sans-serif; color:var(--text); overflow:hidden;}
  #wrap{position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center;}
  #stage{position:relative; width:1000px; max-width:100vw; height:700px; max-height:100vh; }
  canvas#c{position:absolute; top:0; left:0; width:100%; height:100%; border-radius:18px; box-shadow:0 20px 60px #000a, 0 0 0 2px #ffffff14 inset; display:block;}

  #minimap{position:absolute; right:14px; bottom:14px; width:170px; height:110px; border-radius:12px;
    background:rgba(10,14,30,0.92); border:1.5px solid #ffffff55; box-shadow:0 6px 16px #0007;}

  #loadingOverlay{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px;
    background:#0b1024; border-radius:18px; z-index:20;}
  #loadingOverlay .spinner{width:40px;height:40px;border-radius:50%;border:4px solid #ffffff33;border-top-color:var(--accent);animation:spin 0.9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .screen{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; text-align:center; padding:20px; border-radius:18px;}
  .hidden{display:none !important;}

  .title{font-size:clamp(28px,5vw,48px); font-weight:900; letter-spacing:1px;
    background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent3));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 40px #ffffff22; margin:0; filter:drop-shadow(0 4px 10px #000a);}
  .subtitle{color:var(--sub); font-size:14px; margin-top:-10px;}

  .btn{cursor:pointer; border:none; border-radius:14px; padding:14px 30px; font-size:16px; font-weight:800;
    color:#1a1330; background:linear-gradient(180deg,var(--accent),#ffb703); box-shadow:0 8px 0 #a97400, 0 12px 20px #0006;
    transition:transform .08s ease; }
  .btn:active{transform:translateY(6px); box-shadow:0 2px 0 #a97400, 0 4px 10px #0006;}
  .btn.alt{background:linear-gradient(180deg,#7de0ff,#33a6ff); box-shadow:0 8px 0 #1c6ea3, 0 12px 20px #0006;}
  .btn.alt:active{box-shadow:0 2px 0 #1c6ea3, 0 4px 10px #0006;}

  .charGrid{display:flex; gap:18px; flex-wrap:wrap; justify-content:center; max-width:820px;}
  .charCard{width:140px; padding:16px 10px; border-radius:16px; background:var(--panel); border:2px solid var(--panel-border);
    cursor:pointer; transition:transform .12s ease, border-color .12s ease; user-select:none;}
  .charCard:hover{transform:translateY(-4px) scale(1.03);}
  .charCard.selected{border-color:var(--accent); box-shadow:0 0 0 3px #ffd23f55, 0 10px 24px #000a;}
  .charCard .emoji{font-size:46px; display:block; filter:drop-shadow(0 6px 8px #0007);}
  .charCard .name{font-weight:800; margin-top:6px; font-size:14px;}
  .charCard .kartchip{margin-top:8px; height:8px; border-radius:6px;}

  .panel{background:var(--panel); border:2px solid var(--panel-border); border-radius:18px; padding:22px 26px;}

  #hud{position:absolute; inset:0; pointer-events:none; font-weight:800;}
  #hud .top{position:absolute; top:14px; left:14px; right:14px; display:flex; justify-content:space-between; align-items:flex-start;}
  #lapBox, #posBox, #timeBox{background:#00000066; border:1px solid #ffffff33; border-radius:12px; padding:8px 14px; backdrop-filter:blur(3px);}
  #posBox{font-size:20px;}
  #posBox .rankNum{font-size:26px; color:var(--accent);}
  #timeBox{font-variant-numeric:tabular-nums; font-size:16px; letter-spacing:1px;}
  #speedWrap{position:absolute; bottom:16px; left:16px; width:150px;}
  #speedLabel{font-size:11px; color:var(--sub); margin-bottom:3px;}
  #speedBar{height:12px; border-radius:8px; background:#00000066; border:1px solid #ffffff33; overflow:hidden;}
  #speedFill{height:100%; width:0%; background:linear-gradient(90deg,#3ddc97,#ffd23f,#ff5da2); transition:width .06s linear;}
  #boostText{position:absolute; bottom:34px; left:16px; font-size:12px; color:var(--accent2); text-shadow:0 0 6px #ff5da2;}

  #countdown{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:110px; font-weight:900; color:#fff; text-shadow:0 0 30px #ffd23f, 0 6px 0 #0006; pointer-events:none;}

  table.result{border-collapse:collapse; margin:10px auto;}
  table.result th, table.result td{padding:8px 16px; font-size:15px;}
  table.result th{color:var(--sub); border-bottom:1px solid #ffffff33; font-size:12px; letter-spacing:1px;}
  table.result tr.me td{color:var(--accent); font-weight:900;}

  .touchCtl{position:absolute; bottom:16px; width:100%; display:flex; justify-content:space-between; padding:0 16px; pointer-events:none;}
  .touchBtn{pointer-events:auto; width:64px; height:64px; border-radius:50%; background:#ffffff1f; border:2px solid #ffffff44;
    display:flex; align-items:center; justify-content:center; font-size:26px; color:#fff; user-select:none; touch-action:none;}
  .touchBtn:active{background:#ffffff40;}
  .touchGroup{display:flex; gap:14px;}

  footer.hint{position:absolute; bottom:8px; width:100%; text-align:center; font-size:11px; color:var(--sub); pointer-events:none;}

  .confetti{position:absolute; top:-16px; width:8px; height:14px; border-radius:2px; pointer-events:none; z-index:30;
    animation:confettiFall linear forwards;}
  @keyframes confettiFall{
    0%{transform:translateY(0) rotate(0deg); opacity:1;}
    100%{transform:translateY(720px) rotate(540deg); opacity:0.2;}
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c"></canvas>
    <canvas id="minimap" width="170" height="110"></canvas>
    <div id="loadingOverlay"><div class="spinner"></div><div style="color:#a9b3e8;font-size:13px;">3D 트랙 준비 중...</div></div>

    <!-- 시작 화면 -->
    <div id="screenTitle" class="screen hidden">
      <h1 class="title">🏁 미니 카트 대소동 🏁</h1>
      <p class="subtitle">풀 3D로 달리는 초간단 레이싱 · AI로 만든 데모 게임</p>
      <button class="btn" id="btnStart">캐릭터 고르러 가기 ▶</button>
    </div>

    <!-- 캐릭터 선택 -->
    <div id="screenSelect" class="screen hidden">
      <h1 class="title" style="font-size:30px;">캐릭터를 골라줘!</h1>
      <div class="charGrid" id="charGrid"></div>
      <button class="btn" id="btnRaceGo" disabled>레이스 시작 🚦</button>
    </div>

    <!-- 인게임 HUD -->
    <div id="hud" class="hidden">
      <div class="top">
        <div id="lapBox">LAP <span id="lapNow">1</span>/<span id="lapMax">3</span></div>
        <div id="timeBox">00:00.0</div>
        <div id="posBox"><span class="rankNum" id="rankNum">1</span><span id="rankSuffix">st</span></div>
      </div>
      <div id="boostText" style="opacity:0;">BOOST!</div>
      <div id="speedWrap">
        <div id="speedLabel">SPEED</div>
        <div id="speedBar"><div id="speedFill"></div></div>
      </div>
    </div>
    <div id="countdown" class="hidden"></div>

    <!-- 모바일 조작 -->
    <div class="touchCtl hidden" id="touchCtl">
      <div class="touchGroup">
        <div class="touchBtn" id="tLeft">◀</div>
        <div class="touchBtn" id="tRight">▶</div>
      </div>
      <div class="touchGroup">
        <div class="touchBtn" id="tBrake">▼</div>
        <div class="touchBtn" id="tGas">▲</div>
      </div>
    </div>

    <!-- 결과 화면 -->
    <div id="screenResult" class="screen hidden">
      <h1 class="title" style="font-size:34px;" id="resultTitle">🏆 레이스 종료! 🏆</h1>
      <div class="panel">
        <table class="result" id="resultTable"></table>
      </div>
      <div style="display:flex; gap:12px;">
        <button class="btn" id="btnAgain">다시 달리기 🔄</button>
        <button class="btn alt" id="btnPickAgain">캐릭터 다시 고르기</button>
      </div>
    </div>

    <footer class="hint" id="hint">방향키/WASD 로 핸들 조작 · 노란 별 부스터를 지나가면 쌩쌩! · 우하단은 미니맵</footer>
    <div id="confettiLayer" style="position:absolute; inset:0; overflow:hidden; pointer-events:none;"></div>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script>
(() => {
"use strict";
const canvas = document.getElementById("c");
const W = 1000, H = 700;
const mmCanvas = document.getElementById("minimap");
const mmCtx = mmCanvas.getContext("2d");

// ---------- 오디오 (아주 가벼운 합성 효과음) ----------
let actx = null;
function audioCtx(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function beep(freq, dur, type="sine", vol=0.18, delay=0){
  const ac = audioCtx(); if(!ac) return;
  const t0 = ac.currentTime + delay;
  const osc = ac.createOscillator(); const gain = ac.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(vol, t0+0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  osc.connect(gain); gain.connect(ac.destination);
  osc.start(t0); osc.stop(t0+dur+0.02);
}
function sfxCountdown(n){ beep(n===0?880:520, 0.18, "square", 0.15); }
function sfxGo(){ beep(1046,0.35,"sawtooth",0.18); beep(1318,0.3,"sawtooth",0.14,0.08); }
function sfxBoost(){ beep(220,0.25,"sawtooth",0.15); beep(660,0.2,"sine",0.12,0.05); }
function sfxLap(){ beep(784,0.15,"triangle",0.15); beep(988,0.18,"triangle",0.15,0.1); }
function sfxFinish(){ [523,659,784,1046].forEach((f,i)=>beep(f,0.3,"triangle",0.16,i*0.12)); }

// ---------- 유틸 ----------
const TAU = Math.PI*2;
function lerp(a,b,t){return a+(b-a)*t;}
function clamp(v,a,b){return Math.min(b,Math.max(a,v));}
function angDiff(a,b){ let d=(b-a+Math.PI*3)%TAU - Math.PI; return d; }

// ---------- 트랙 정의 (둥근 사각형 서킷, 2D 좌표계로 물리 계산) ----------
const CX=500, CY=350, RW=680, RH=420, R=150;
const TRACK_HALF_W = 68;
const segs = (() => {
  const s = [];
  const A = {x:CX-RW/2+R, y:CY+RH/2};
  const B = {x:CX+RW/2-R, y:CY+RH/2};
  s.push({type:"line", p0:A, p1:B, len: B.x-A.x});
  s.push({type:"arc", c:{x:CX+RW/2-R, y:CY+RH/2-R}, r:R, a0:Math.PI/2, a1:0, len:(Math.PI/2)*R});
  const C = {x:CX+RW/2, y:CY+RH/2-R};
  const D = {x:CX+RW/2, y:CY-RH/2+R};
  s.push({type:"line", p0:C, p1:D, len: C.y-D.y});
  s.push({type:"arc", c:{x:CX+RW/2-R, y:CY-RH/2+R}, r:R, a0:0, a1:-Math.PI/2, len:(Math.PI/2)*R});
  const E = {x:CX+RW/2-R, y:CY-RH/2};
  const F = {x:CX-RW/2+R, y:CY-RH/2};
  s.push({type:"line", p0:E, p1:F, len: E.x-F.x});
  s.push({type:"arc", c:{x:CX-RW/2+R, y:CY-RH/2+R}, r:R, a0:-Math.PI/2, a1:-Math.PI, len:(Math.PI/2)*R});
  const G = {x:CX-RW/2, y:CY-RH/2+R};
  const Hh = {x:CX-RW/2, y:CY+RH/2-R};
  s.push({type:"line", p0:G, p1:Hh, len: Hh.y-G.y});
  s.push({type:"arc", c:{x:CX-RW/2+R, y:CY+RH/2-R}, r:R, a0:-Math.PI, a1:-Math.PI*1.5, len:(Math.PI/2)*R});
  return s;
})();
const TOTAL_LEN = segs.reduce((a,s)=>a+s.len,0);
function pointAt(s){
  s = ((s % TOTAL_LEN) + TOTAL_LEN) % TOTAL_LEN;
  let acc = 0;
  for(const seg of segs){
    if(s <= acc+seg.len || seg===segs[segs.length-1]){
      const t = seg.len>0 ? clamp((s-acc)/seg.len,0,1) : 0;
      if(seg.type==="line"){
        const x = lerp(seg.p0.x, seg.p1.x, t), y = lerp(seg.p0.y, seg.p1.y, t);
        const ang = Math.atan2(seg.p1.y-seg.p0.y, seg.p1.x-seg.p0.x);
        return {x,y,ang};
      } else {
        const a = lerp(seg.a0, seg.a1, t);
        const x = seg.c.x + seg.r*Math.cos(a), y = seg.c.y + seg.r*Math.sin(a);
        const ang = Math.atan2(-Math.cos(a), Math.sin(a));
        return {x,y,ang};
      }
    }
    acc += seg.len;
  }
  return {x:CX,y:CY,ang:0};
}
const SAMPLE_N = 420;
const samples = [];
for(let i=0;i<SAMPLE_N;i++){ samples.push(pointAt(i/SAMPLE_N*TOTAL_LEN)); }
function nearestIndex(x,y){
  let bi=0, bd=Infinity;
  for(let i=0;i<SAMPLE_N;i++){
    const d = (samples[i].x-x)**2 + (samples[i].y-y)**2;
    if(d<bd){ bd=d; bi=i; }
  }
  return {idx:bi, dist:Math.sqrt(bd)};
}
const BOOST_S = [0.28, 0.72];
const BOOST_IDX = BOOST_S.map(f=>Math.floor(f*SAMPLE_N));
const trackBB = (()=>{
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(const s of samples){ minX=Math.min(minX,s.x); maxX=Math.max(maxX,s.x); minY=Math.min(minY,s.y); maxY=Math.max(maxY,s.y); }
  return {minX,maxX,minY,maxY};
})();
const TREE_SPOTS = [30,70,120,170,220,270,320,370].map(i=>i%SAMPLE_N);

// ---------- 캐릭터 ----------
const CHARACTERS = [
  {id:"fox",  name:"여우 레이서",  emoji:"🦊", color:0xff8a3d, color2:0xff5d00},
  {id:"cat",  name:"냥냥 스피드",  emoji:"🐱", color:0xb98bff, color2:0x7b3dff},
  {id:"bear", name:"곰돌 파워",    emoji:"🐻", color:0xc98a5b, color2:0x8a5a2e},
  {id:"bunny",name:"토깽 점프",    emoji:"🐰", color:0xff8fd0, color2:0xff3d9e},
  {id:"panda",name:"판다 드리프트",emoji:"🐼", color:0xe9e9e9, color2:0x333333},
  {id:"frog", name:"개굴 부스터",  emoji:"🐸", color:0x7be08a, color2:0x2e9e4a},
];

// ---------- 상태 ----------
const LAPS = 3;
let racers = [];
let playerIdx = 0;
let raceState = "idle";
let raceTime = 0;
let particles = [];
let camShake = 0;
let selectedChar = null;
const keys = {};

function makeRacer(charDef, isPlayer, gridPos){
  const startPt = samples[0];
  const normal = {x:Math.sin(startPt.ang), y:-Math.cos(startPt.ang)};
  const lane = [-42,-14,14,42][gridPos];
  return {
    char: charDef, isPlayer,
    x: startPt.x + normal.x*lane - Math.cos(startPt.ang)*gridPos*26,
    y: startPt.y + normal.y*lane - Math.sin(startPt.ang)*gridPos*26,
    angle: startPt.ang, speed: 0, steerVisual:0,
    lastIdx: 0, lap: 0, finished:false, finishTime:0,
    boostT: 0, offTrack:false, aiTargetOffset: lerp(-38,38, Math.random()),
    smokeCooldown:0, place:1, totalProgress:0, mesh:null, flameMesh:null,
  };
}

function resetRace(){
  for(const car of racers){ if(car.mesh) scene.remove(car.mesh); }
  racers = [];
  const shuffledChars = [...CHARACTERS].sort(()=>Math.random()-0.5);
  const chosen = [selectedChar, ...shuffledChars.filter(c=>c.id!==selectedChar.id).slice(0,3)];
  for(let i=0;i<4;i++){
    const car = makeRacer(chosen[i], i===0, i);
    buildKartMesh(car);
    racers.push(car);
  }
  buildHoodRig(selectedChar);
  playerIdx = 0;
  raceTime = 0;
  particles = [];
  raceState = "countdown";
  startCountdown();
}

// ---------- 물리 (2D 좌표계 그대로, 렌더링만 3D) ----------
const MAX_SPEED = 260;
const ACCEL = 230;
const BRAKE = 420;
const FRICTION = 150;
const TURN_RATE = 3.0;

function updateCar(car, input, dt){
  if(car.finished){ car.speed *= 0.9; }
  else {
    if(input.throttle>0) car.speed += ACCEL*dt*input.throttle;
    else if(input.throttle<0) car.speed += BRAKE*dt*input.throttle;
    else {
      if(car.speed>0) car.speed = Math.max(0, car.speed - FRICTION*dt);
      else car.speed = Math.min(0, car.speed + FRICTION*dt);
    }
  }
  const boostMul = car.boostT>0 ? 1.55 : 1;
  const trackMul = car.offTrack ? 0.55 : 1;
  const capSpeed = MAX_SPEED*boostMul*trackMul;
  car.speed = clamp(car.speed, -MAX_SPEED*0.5, capSpeed);

  car.steerVisual = lerp(car.steerVisual, input.steer, 0.18);
  const speedFactor = 0.35 + 0.65*clamp(Math.abs(car.speed)/MAX_SPEED,0,1);
  const dirMul = car.speed<0 ? -1 : 1;
  car.angle += input.steer*TURN_RATE*speedFactor*dirMul*dt;

  car.x += Math.cos(car.angle)*car.speed*dt;
  car.y += Math.sin(car.angle)*car.speed*dt;

  if(car.boostT>0) car.boostT -= dt;
  if(car.smokeCooldown>0) car.smokeCooldown -= dt;

  const near = nearestIndex(car.x, car.y);
  car.offTrack = near.dist > TRACK_HALF_W;

  let idxDelta = near.idx - car.lastIdx;
  if(idxDelta < -SAMPLE_N*0.5) { car.lap += 1; if(car.isPlayer) sfxLap(); }
  else if(idxDelta > SAMPLE_N*0.5) { car.lap -= 1; }
  car.lastIdx = near.idx;
  car.totalProgress = car.lap*SAMPLE_N + near.idx;

  if(!car.finished && car.lap >= LAPS){
    car.finished = true;
    car.finishTime = raceTime;
  }

  const bIdx = near.idx;
  for(const bi of BOOST_IDX){
    if(Math.abs(bIdx-bi) < 5 && car.boostT<=0 && Math.abs(car.speed)>20){
      car.boostT = 1.1;
      spawnBoostBurst(car);
      if(car.isPlayer) sfxBoost();
    }
  }

  if(Math.abs(input.steer)>0.5 && Math.abs(car.speed)>120 && car.smokeCooldown<=0){
    spawnSmoke(car);
    car.smokeCooldown = 0.05;
  }
}

function aiInput(car){
  const near = nearestIndex(car.x, car.y);
  const lookahead = clamp(6 + Math.floor(Math.abs(car.speed)/22), 6, 26);
  const targetSample = samples[(near.idx+lookahead)%SAMPLE_N];
  const normal = {x:Math.sin(targetSample.ang), y:-Math.cos(targetSample.ang)};
  const tx = targetSample.x + normal.x*car.aiTargetOffset;
  const ty = targetSample.y + normal.y*car.aiTargetOffset;
  const desiredAng = Math.atan2(ty-car.y, tx-car.x);
  const diff = angDiff(car.angle, desiredAng);
  const steer = clamp(diff*1.6, -1, 1);
  const sharp = clamp(1-Math.abs(diff)*1.1, 0.35, 1);
  let throttle = sharp;

  const player = racers[playerIdx];
  if(player && player!==car){
    const gap = car.totalProgress - player.totalProgress;
    if(gap > 40) throttle *= 0.82;
    else if(gap < -60) throttle *= 1.12;
  }
  return {throttle: clamp(throttle,0,1), steer};
}

function playerInput(){
  let steer = 0, throttle = 0;
  if(keys["ArrowLeft"]||keys["a"]||keys["A"]) steer -= 1;
  if(keys["ArrowRight"]||keys["d"]||keys["D"]) steer += 1;
  if(keys["ArrowUp"]||keys["w"]||keys["W"]) throttle += 1;
  if(keys["ArrowDown"]||keys["s"]||keys["S"]) throttle -= 1;
  return {throttle, steer};
}

// ---------- 3D 텍스처 생성 (외부 이미지 없이 캔버스로 즉석 제작) ----------
function makeEmojiTexture(emoji, size=128){
  const cnv=document.createElement("canvas"); cnv.width=cnv.height=size;
  const c = cnv.getContext("2d");
  c.font = `${Math.floor(size*0.8)}px sans-serif`;
  c.textAlign="center"; c.textBaseline="middle";
  c.fillText(emoji, size/2, size*0.55);
  const tex = new THREE.CanvasTexture(cnv);
  tex.needsUpdate = true;
  return tex;
}
function makeAsphaltTexture(){
  const cnv=document.createElement("canvas"); cnv.width=cnv.height=256;
  const c=cnv.getContext("2d");
  c.fillStyle="#6b7186"; c.fillRect(0,0,256,256);
  for(let i=0;i<1000;i++){

  }

  }
  const tex = new THREE.CanvasTexture(cnv);

  return tex;
}
function makeGrassTexture(){

function makeCheckerTexture(){

function makeSoftDotTexture(colorHex){

function V3(x,y,h=0){ return new THREE.Vector3(x-CX, h, y-CY); }

function buildStripGeometry(leftFn, rightFn, colorFn, height, uvTile){
  const positions=[], normals=[], uvs=[], colors=[], indices=[];
  const spacing = TOTAL_LEN/SAMPLE_N;
  for(let i=0;i<=SAMPLE_N;i++){
    const idx = i%SAMPLE_N;
    const s = samples[idx];
    const nx = Math.sin(s.ang), ny = -Math.cos(s.ang);
    const L = leftFn(s,nx,ny), R = rightFn(s,nx,ny);
    positions.push(L.x-CX, height, L.y-CY,  R.x-CX, height, R.y-CY);
    normals.push(0,1,0, 0,1,0);
    const v = (i*spacing)/(uvTile||40);
    uvs.push(0,v, 1,v);
    const col = colorFn(idx);
    colors.push(col[0],col[1],col[2], col[0],col[1],col[2]);
  }
  for(let i=0;i<SAMPLE_N;i++){
    const a=i*2, b=i*2+1, c=(i+1)*2, d=(i+1)*2+1;
    indices.push(a,c,b, b,c,d);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(positions,3));
  geo.setAttribute("normal", new THREE.Float32BufferAttribute(normals,3));
  geo.setAttribute("uv", new THREE.Float32BufferAttribute(uvs,2));
  geo.setAttribute("color", new THREE.Float32BufferAttribute(colors,3));
  geo.setIndex(indices);
  return geo;
}

function buildDashLines(){
  const positions=[], normals=[], colors=[], indices=[];
  let vi=0;
  for(let i=0;i<SAMPLE_N;i++){
    if(Math.floor(i/4)%2!==0) continue;
    const s0=samples[i], s1=samples[(i+1)%SAMPLE_N];
    const n0x=Math.sin(s0.ang), n0y=-Math.cos(s0.ang);
    const n1x=Math.sin(s1.ang), n1y=-Math.cos(s1.ang);
    const w=4;
    const p0L={x:s0.x+n0x*w,y:s0.y+n0y*w}, p0R={x:s0.x-n0x*w,y:s0.y-n0y*w};
    const p1L={x:s1.x+n1x*w,y:s1.y+n1y*w}, p1R={x:s1.x-n1x*w,y:s1.y-n1y*w};
    positions.push(
      p0L.x-CX,0.05,p0L.y-CY,  p0R.x-CX,0.05,p0R.y-CY,
      p1R.x-CX,0.05,p1R.y-CY,  p1L.x-CX,0.05,p1L.y-CY
    );
    for(let k=0;k<4;k++){ normals.push(0,1,0); colors.push(1,1,1); }
    indices.push(vi,vi+2,vi+1, vi,vi+3,vi+2);
    vi+=4;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(positions,3));
  geo.setAttribute("normal", new THREE.Float32BufferAttribute(normals,3));
  geo.setAttribute("color", new THREE.Float32BufferAttribute(colors,3));
  geo.setIndex(indices);
  return geo;
}

function buildSky(){
  const geo = new THREE.SphereGeometry(650, 24, 16);
  const mat = new THREE.ShaderMaterial({
    uniforms:{
      topColor:{value:new THREE.Color(0x1c3a7a)},
      bottomColor:{value:new THREE.Color(0x9fd3e8)},
      offset:{value:15}, exponent:{value:0.65}
    },
    vertexShader:`
      varying vec3 vWorldPosition;
      void main(){
        vec4 wp = modelMatrix * vec4(position,1.0);
        vWorldPosition = wp.xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
      }`,
    fragmentShader:`
      uniform vec3 topColor; uniform vec3 bottomColor; uniform float offset; uniform float exponent;
      varying vec3 vWorldPosition;
      void main(){
        float h = normalize(vWorldPosition + vec3(0.0, offset, 0.0)).y;
        gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h,0.0), exponent), 0.0)), 1.0);
      }`,
    side: THREE.BackSide,
    depthWrite:false,
  });
  scene.add(new THREE.Mesh(geo, mat));

  const sunGeo = new THREE.SphereGeometry(22,16,16);

function buildTrackMeshes(){
  const asphaltTex = makeAsphaltTexture();
  const roadGeo = buildStripGeometry(
    (s,nx,ny)=>({x:s.x+nx*TRACK_HALF_W, y:s.y+ny*TRACK_HALF_W}),
    (s,nx,ny)=>({x:s.x-nx*TRACK_HALF_W, y:s.y-ny*TRACK_HALF_W}),
    idx => {
      const isFinish = idx<3 || idx>SAMPLE_N-3;
      if(isFinish) return [1,1,1];
      const isBoost = BOOST_IDX.some(bi=>Math.abs(idx-bi)<6);
      if(isBoost) return [1.3,1.15,0.55];
      const band = Math.floor(idx/4)%2===0;
      return band ? [1.05,1.05,1.1] : [0.92,0.92,1.0];
    },
    0.02, 40
  );
  const roadMat = new THREE.MeshStandardMaterial({map:asphaltTex, vertexColors:true, roughness:0.95, side:THREE.DoubleSide, emissive:0x555a68, emissiveIntensity:0.85});
  const roadMesh = new THREE.Mesh(roadGeo, roadMat);
  roadMesh.receiveShadow = true;
  scene.add(roadMesh);

  const curbMat = new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.7, side:THREE.DoubleSide, emissive:0x555555, emissiveIntensity:0.8});
  const curbLGeo = buildStripGeometry(
    (s,nx,ny)=>({x:s.x+nx*(TRACK_HALF_W+9), y:s.y+ny*(TRACK_HALF_W+9)}),
    (s,nx,ny)=>({x:s.x+nx*TRACK_HALF_W, y:s.y+ny*TRACK_HALF_W}),
    idx => Math.floor(idx/4)%2===0 ? [0.85,0.12,0.12] : [0.95,0.95,0.95],
    0.03, 40
  );
  const curbRGeo = buildStripGeometry(
    (s,nx,ny)=>({x:s.x-nx*TRACK_HALF_W, y:s.y-ny*TRACK_HALF_W}),
    (s,nx,ny)=>({x:s.x-nx*(TRACK_HALF_W+9), y:s.y-ny*(TRACK_HALF_W+9)}),
    idx => Math.floor(idx/4)%2===0 ? [0.95,0.95,0.95] : [0.85,0.12,0.12],
    0.03, 40
  );
  const curbL = new THREE.Mesh(curbLGeo, curbMat); curbL.receiveShadow=true; scene.add(curbL);
  const curbR = new THREE.Mesh(curbRGeo, curbMat); curbR.receiveShadow=true; scene.add(curbR);

  const dashGeo = buildDashLines();
  const dashMat = new THREE.MeshBasicMaterial({vertexColors:true});
  scene.add(new THREE.Mesh(dashGeo, dashMat));
}

function spawnBoostBurst(car){
  for(let i=0;i<10;i++){
    const a = Math.random()*TAU;
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({map:dotTexOrange, transparent:true, depthWrite:false}));
    sprite.scale.set(6,6,1);
    sprite.position.set(car.x-CX, 8, car.y-CY);
    scene.add(sprite);
    particles.push({x:car.x,y:car.y,h:8,vx:Math.cos(a)*70,vy:Math.sin(a)*70,vh:30,life:0.5,maxLife:0.5,size:6,type:"spark",sprite});

function updateParticles3D(dt){
  for(const p of particles){
    p.x += p.vx*dt; p.y += p.vy*dt; p.h += p.vh*dt; p.vh -= 40*dt; p.life -= dt;
    if(p.type==="smoke"){ p.size += 12*dt; }
    if(p.sprite){
      p.sprite.position.set(p.x-CX, Math.max(0.5,p.h), p.y-CY);
      const a = clamp(p.life/p.maxLife,0,1);
      p.sprite.material.opacity = p.type==="smoke" ? a*0.4 : a;
      p.sprite.scale.set(p.size,p.size,1);
    }
  }
  const dead = particles.filter(p=>p.life<=0);
  for(const p of dead){ if(p.sprite) scene.remove(p.sprite); }
  particles = particles.filter(p=>p.life>0);
}

const EYE_HEIGHT = 27;
function updateCamera(player, dt){
  const behind = 7;
  const cx = player.x - Math.cos(player.angle)*behind - CX;
  const cz = player.y - Math.sin(player.angle)*behind - CY;
  let cy = EYE_HEIGHT;
  if(camShake>0){
    camera.position.set(cx+(Math.random()-0.5)*camShake*0.4, cy+(Math.random()-0.5)*camShake*0.3, cz+(Math.random()-0.5)*camShake*0.4);
  } else {
    camera.position.set(cx,cy,cz);
  }
  const lookDist = 45;
  const target = new THREE.Vector3(
    player.x + Math.cos(player.angle)*lookDist - CX,
    EYE_HEIGHT-7,
    player.y + Math.sin(player.angle)*lookDist - CY
  );
  camera.up.set(0,1,0);
  camera.lookAt(target);
  const bank = clamp(player.steerVisual,-1,1)*0.09;
  camera.rotateZ(bank);
  if(hoodWheelMesh) hoodWheelMesh.rotation.z = -player.steerVisual*0.9;
}

function updateKartMeshes(){
  for(const car of racers){
    if(!car.mesh) continue;
    car.mesh.position.set(car.x-CX, 0, car.y-CY);
    const target = new THREE.Vector3(
      car.x + Math.cos(car.angle)*12 - CX, 0, car.y + Math.sin(car.angle)*12 - CY
    );
    car.mesh.up.set(0,1,0);
    car.mesh.lookAt(target);
    car.mesh.rotateZ(-clamp(car.steerVisual,-1,1)*0.16);
    if(car.flameMesh) car.flameMesh.visible = car.boostT>0;
  }
}

function updateBoostPads(t){
  for(const b of boostPadObjs){
    const pulse = 0.5+0.5*Math.sin(t*5+b.phase);
    b.pad.material.emissiveIntensity = 0.35+pulse*0.5;
    b.light.intensity = 0.5+pulse*0.8;
    b.star.position.y = 26+Math.sin(t*4+b.phase)*5;
  }
}

  mmCtx.clearRect(0,0,170,110);
  const pad=12;
  const sc = Math.min((170-2*pad)/(trackBB.maxX-trackBB.minX), (110-2*pad)/(trackBB.maxY-trackBB.minY));
  const toMap = (wx,wy)=>({x:pad+(wx-trackBB.minX)*sc, y:pad+(wy-trackBB.minY)*sc});
  mmCtx.beginPath();
  samples.forEach((s,i)=>{ const p=toMap(s.x,s.y); if(i===0) mmCtx.moveTo(p.x,p.y); else mmCtx.lineTo(p.x,p.y); });
  mmCtx.closePath();
  mmCtx.strokeStyle="#ffffff90"; mmCtx.lineWidth=4; mmCtx.stroke();
  for(const car of racers){
    const p = toMap(car.x,car.y);
    mmCtx.beginPath();
    mmCtx.fillStyle = car.isPlayer ? "#ffd23f" : `#${car.char.color.toString(16).padStart(6,"0")}`;
    mmCtx.arc(p.x,p.y, car.isPlayer?5.5:3.5, 0, TAU);
    mmCtx.fill();
    if(car.isPlayer){ mmCtx.strokeStyle="#fff"; mmCtx.lineWidth=1.5; mmCtx.stroke(); }
  }
}

// ---------- 순위 계산 ----------
function updateRanks(){
  const sorted = [...racers].sort((a,b)=>b.totalProgress-a.totalProgress);
  sorted.forEach((r,i)=>r.place=i+1);
}

// ---------- UI 참조 ----------
const screenTitle = document.getElementById("screenTitle");
const screenSelect = document.getElementById("screenSelect");
const screenResult = document.getElementById("screenResult");
const hud = document.getElementById("hud");
const countdownEl = document.getElementById("countdown");
const touchCtl = document.getElementById("touchCtl");
const charGrid = document.getElementById("charGrid");
const btnRaceGo = document.getElementById("btnRaceGo");
const loadingOverlay = document.getElementById("loadingOverlay");

CHARACTERS.forEach(c=>{
  const hex = "#"+c.color.toString(16).padStart(6,"0");
  const hex2 = "#"+c.color2.toString(16).padStart(6,"0");
  const card = document.createElement("div");
  card.className = "charCard";
  card.innerHTML = `<span class="emoji">${c.emoji}</span><div class="name">${c.name}</div>
    <div class="kartchip" style="background:linear-gradient(90deg,${hex2},${hex})"></div>`;
  card.addEventListener("click", ()=>{
    document.querySelectorAll(".charCard").forEach(el=>el.classList.remove("selected"));
    card.classList.add("selected");
    selectedChar = c;
    btnRaceGo.disabled = false;
    audioCtx();
  });
  charGrid.appendChild(card);
});

document.getElementById("btnStart").addEventListener("click", ()=>{
  audioCtx();
  screenTitle.classList.add("hidden");
  screenSelect.classList.remove("hidden");
});
btnRaceGo.addEventListener("click", ()=>{
  if(!selectedChar) return;
  screenSelect.classList.add("hidden");
  hud.classList.remove("hidden");
  if('ontouchstart' in window) touchCtl.classList.remove("hidden");
  resetRace();
});
document.getElementById("btnAgain").addEventListener("click", ()=>{
  screenResult.classList.add("hidden");
  hud.classList.remove("hidden");
  resetRace();
});
document.getElementById("btnPickAgain").addEventListener("click", ()=>{
  screenResult.classList.add("hidden");
  screenSelect.classList.remove("hidden");
});

window.addEventListener("keydown", e=>{ keys[e.key]=true; });
window.addEventListener("keyup", e=>{ keys[e.key]=false; });

function bindTouch(id, key){
  const el = document.getElementById(id);
  const on = (e)=>{ e.preventDefault(); keys[key]=true; };
  const off = (e)=>{ e.preventDefault(); keys[key]=false; };
  el.addEventListener("touchstart", on, {passive:false});
  el.addEventListener("touchend", off, {passive:false});
  el.addEventListener("touchcancel", off, {passive:false});
}
bindTouch("tLeft","ArrowLeft");
bindTouch("tRight","ArrowRight");
bindTouch("tGas","ArrowUp");
bindTouch("tBrake","ArrowDown");

function startCountdown(){
  let n = 3;
  countdownEl.classList.remove("hidden");
  countdownEl.textContent = n;
  sfxCountdown(n);
  const iv = setInterval(()=>{
    n--;
    if(n>0){ countdownEl.textContent = n; sfxCountdown(n); }
    else if(n===0){ countdownEl.textContent = "GO!"; sfxGo(); }
    else {
      clearInterval(iv);
      countdownEl.classList.add("hidden");
      raceState = "racing";
    }
  }, 800);
}

function fmtTime(t){
  const m = Math.floor(t/60);
  const s = (t%60).toFixed(1).padStart(4,"0");
  return `${String(m).padStart(2,"0")}:${s}`;
}

function showResults(){
  raceState = "finished";
  hud.classList.add("hidden");
  touchCtl.classList.add("hidden");
  spawnConfettiDOM();
  sfxFinish();
  const sorted = [...racers].sort((a,b)=>{
    if(a.finished && b.finished) return a.finishTime-b.finishTime;
    if(a.finished) return -1;
    if(b.finished) return 1;
    return b.totalProgress-a.totalProgress;
  });
  const tbl = document.getElementById("resultTable");
  const medal = ["🥇","🥈","🥉","4️⃣"];
  let html = "<tr><th>순위</th><th>캐릭터</th><th>기록</th></tr>";
  sorted.forEach((r,i)=>{
    html += `<tr class="${r.isPlayer?'me':''}"><td>${medal[i]}</td><td>${r.char.emoji} ${r.char.name}${r.isPlayer?' (나)':''}</td><td>${r.finished?fmtTime(r.finishTime):'-'}</td></tr>`;
  });
  tbl.innerHTML = html;
  const you = sorted.findIndex(r=>r.isPlayer)+1;
  document.getElementById("resultTitle").textContent = you===1 ? "🏆 우승 축하해요! 🏆" : `레이스 종료! 당신은 ${you}등`;
  screenResult.classList.remove("hidden");
}

// ---------- 초기화 & 메인 루프 ----------
function initThree(){
  renderer = new THREE.WebGLRenderer({canvas, antialias:true});
  renderer.setSize(W,H,false);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x9fd3e8, 260, 620);

  camera = new THREE.PerspectiveCamera(72, W/H, 0.5, 1400);
  scene.add(camera);

  buildSky();
  buildLights();
  buildGround();
  buildTrackMeshes();
  buildTrees();
  buildBoostPads();
  buildFinishGate();

  loadingOverlay.classList.add("hidden");
  screenTitle.classList.remove("hidden");
}

let lastT = performance.now();
let clockT = 0;
function loop(now){
  const dt = Math.min(0.033, (now-lastT)/1000);
  lastT = now;
  clockT += dt;

  if(raceState==="racing" || raceState==="countdown"){
    if(raceState==="racing") raceTime += dt;
    for(const car of racers){
      const wasOff = car.offTrack;
      const input = car.isPlayer ? (raceState==="racing"?playerInput():{throttle:0,steer:0}) : (raceState==="racing"?aiInput(car):{throttle:0,steer:0});
      updateCar(car, input, dt);
      if(car.isPlayer && car.offTrack && !wasOff) camShake = 5;
    }
    updateRanks();
    if(raceState==="racing" && racers[playerIdx] && racers[playerIdx].finished){
      showResults();
    }
  }
  if(camShake>0) camShake = Math.max(0, camShake-dt*20);

  updateParticles3D(dt);
  updateBoostPads(clockT);

  const player = racers[playerIdx];
  if(player){
    updateCamera(player, dt);
    updateKartMeshes();
  }
  if(renderer) renderer.render(scene, camera);
  drawMinimap();

  if((raceState==="racing" || raceState==="countdown") && player){
    document.getElementById("lapNow").textContent = Math.min(player.lap+1, LAPS);
    document.getElementById("timeBox").textContent = fmtTime(raceTime);
    document.getElementById("rankNum").textContent = player.place;
    document.getElementById("rankSuffix").textContent = player.place===1?"st":player.place===2?"nd":player.place===3?"rd":"th";
    const spd = clamp(Math.abs(player.speed)/MAX_SPEED,0,1);
    document.getElementById("speedFill").style.width = (spd*100)+"%";
    document.getElementById("boostText").style.opacity = player.boostT>0 ? 1 : 0;
  }

  requestAnimationFrame(loop);
}

initThree();
requestAnimationFrame(loop);
})();
</script>
