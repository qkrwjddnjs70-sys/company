<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>미니 카트 대소동</title>
<style>
  :root{
    --bg1:#0b1024; --bg2:#1b1140; --panel:#151a33cc; --panel-border:#4c5aa6;
    --accent:#ffd23f; --accent2:#ff5da2; --accent3:#3ddc97; --text:#eef1ff; --sub:#a9b3e8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:radial-gradient(1200px 800px at 50% -10%, #2a2560 0%, var(--bg1) 55%, #05060f 100%);
    font-family:"Trebuchet MS","Apple SD Gothic Neo","Malgun Gothic",sans-serif; color:var(--text); overflow:hidden;}
  #wrap{position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center;}
  #stage{position:relative; width:1000px; max-width:100vw; height:700px; max-height:100vh; }
  canvas{position:absolute; top:0; left:0; width:100%; height:100%; border-radius:18px; box-shadow:0 20px 60px #000a, 0 0 0 2px #ffffff14 inset;}

  .screen{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; text-align:center; padding:20px; border-radius:18px;}
  .hidden{display:none !important;}

  .title{font-size:clamp(28px,5vw,48px); font-weight:900; letter-spacing:1px;
    background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent3));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 40px #ffffff22; margin:0; filter:drop-shadow(0 4px 10px #000a);}
  .subtitle{color:var(--sub); font-size:14px; margin-top:-10px;}

  .btn{cursor:pointer; border:none; border-radius:14px; padding:14px 30px; font-size:16px; font-weight:800;
    color:#1a1330; background:linear-gradient(180deg,var(--accent),#ffb703); box-shadow:0 8px 0 #a97400, 0 12px 20px #0006;
    transition:transform .08s ease; }
  .btn:active{transform:translateY(6px); box-shadow:0 2px 0 #a97400, 0 4px 10px #0006;}
  .btn.alt{background:linear-gradient(180deg,#7de0ff,#33a6ff); box-shadow:0 8px 0 #1c6ea3, 0 12px 20px #0006;}
  .btn.alt:active{box-shadow:0 2px 0 #1c6ea3, 0 4px 10px #0006;}

  .charGrid{display:flex; gap:18px; flex-wrap:wrap; justify-content:center; max-width:820px;}
  .charCard{width:140px; padding:16px 10px; border-radius:16px; background:var(--panel); border:2px solid var(--panel-border);
    cursor:pointer; transition:transform .12s ease, border-color .12s ease; user-select:none;}
  .charCard:hover{transform:translateY(-4px) scale(1.03);}
  .charCard.selected{border-color:var(--accent); box-shadow:0 0 0 3px #ffd23f55, 0 10px 24px #000a;}
  .charCard .emoji{font-size:46px; display:block; filter:drop-shadow(0 6px 8px #0007);}
  .charCard .name{font-weight:800; margin-top:6px; font-size:14px;}
  .charCard .kartchip{margin-top:8px; height:8px; border-radius:6px;}

  .panel{background:var(--panel); border:2px solid var(--panel-border); border-radius:18px; padding:22px 26px;}

  #hud{position:absolute; inset:0; pointer-events:none; font-weight:800;}
  #hud .top{position:absolute; top:14px; left:14px; right:14px; display:flex; justify-content:space-between; align-items:flex-start;}
  #lapBox, #posBox, #timeBox{background:#00000066; border:1px solid #ffffff33; border-radius:12px; padding:8px 14px; backdrop-filter:blur(3px);}
  #posBox{font-size:20px;}
  #posBox .rankNum{font-size:26px; color:var(--accent);}
  #timeBox{font-variant-numeric:tabular-nums; font-size:16px; letter-spacing:1px;}
  #speedWrap{position:absolute; bottom:16px; left:16px; width:150px;}
  #speedLabel{font-size:11px; color:var(--sub); margin-bottom:3px;}
  #speedBar{height:12px; border-radius:8px; background:#00000066; border:1px solid #ffffff33; overflow:hidden;}
  #speedFill{height:100%; width:0%; background:linear-gradient(90deg,#3ddc97,#ffd23f,#ff5da2); transition:width .06s linear;}
  #boostText{position:absolute; bottom:34px; left:16px; font-size:12px; color:var(--accent2); text-shadow:0 0 6px #ff5da2;}

  #countdown{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:110px; font-weight:900; color:#fff; text-shadow:0 0 30px #ffd23f, 0 6px 0 #0006; pointer-events:none;}

  table.result{border-collapse:collapse; margin:10px auto;}
  table.result th, table.result td{padding:8px 16px; font-size:15px;}
  table.result th{color:var(--sub); border-bottom:1px solid #ffffff33; font-size:12px; letter-spacing:1px;}
  table.result tr.me td{color:var(--accent); font-weight:900;}

  .touchCtl{position:absolute; bottom:16px; width:100%; display:flex; justify-content:space-between; padding:0 16px; pointer-events:none;}
  .touchBtn{pointer-events:auto; width:64px; height:64px; border-radius:50%; background:#ffffff1f; border:2px solid #ffffff44;
    display:flex; align-items:center; justify-content:center; font-size:26px; color:#fff; user-select:none; touch-action:none;}
  .touchBtn:active{background:#ffffff40;}
  .touchGroup{display:flex; gap:14px;}

  footer.hint{position:absolute; bottom:8px; width:100%; text-align:center; font-size:11px; color:var(--sub); pointer-events:none;}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c" width="1000" height="700"></canvas>

    <!-- 시작 화면 -->
    <div id="screenTitle" class="screen">
      <h1 class="title">🏁 미니 카트 대소동 🏁</h1>
      <p class="subtitle">1인칭 시점으로 달리는 초간단 레이싱 · AI로 만든 데모 게임</p>
      <button class="btn" id="btnStart">캐릭터 고르러 가기 ▶</button>
    </div>

    <!-- 캐릭터 선택 -->
    <div id="screenSelect" class="screen hidden">
      <h1 class="title" style="font-size:30px;">캐릭터를 골라줘!</h1>
      <div class="charGrid" id="charGrid"></div>
      <button class="btn" id="btnRaceGo" disabled>레이스 시작 🚦</button>
    </div>

    <!-- 인게임 HUD -->
    <div id="hud" class="hidden">
      <div class="top">
        <div id="lapBox">LAP <span id="lapNow">1</span>/<span id="lapMax">3</span></div>
        <div id="timeBox" id="timeBox">00:00.0</div>
        <div id="posBox"><span class="rankNum" id="rankNum">1</span><span id="rankSuffix">st</span></div>
      </div>
      <div id="boostText" style="opacity:0;">BOOST!</div>
      <div id="speedWrap">
        <div id="speedLabel">SPEED</div>
        <div id="speedBar"><div id="speedFill"></div></div>
      </div>
    </div>
    <div id="countdown" class="hidden"></div>

    <!-- 모바일 조작 -->
    <div class="touchCtl hidden" id="touchCtl">
      <div class="touchGroup">
        <div class="touchBtn" id="tLeft">◀</div>
        <div class="touchBtn" id="tRight">▶</div>
      </div>
      <div class="touchGroup">
        <div class="touchBtn" id="tBrake">▼</div>
        <div class="touchBtn" id="tGas">▲</div>
      </div>
    </div>

    <!-- 결과 화면 -->
    <div id="screenResult" class="screen hidden">
      <h1 class="title" style="font-size:34px;" id="resultTitle">🏆 레이스 종료! 🏆</h1>
      <div class="panel">
        <table class="result" id="resultTable"></table>
      </div>
      <div style="display:flex; gap:12px;">
        <button class="btn" id="btnAgain">다시 달리기 🔄</button>
        <button class="btn alt" id="btnPickAgain">캐릭터 다시 고르기</button>
      </div>
    </div>

    <footer class="hint" id="hint">방향키/WASD 로 핸들 조작 · 노란 별 부스터를 지나가면 쌩쌩! · 우하단은 미니맵</footer>
  </div>
</div>

<script>
(() => {
"use strict";
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;

// ---------- 오디오 (아주 가벼운 합성 효과음) ----------
let actx = null;
function audioCtx(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function beep(freq, dur, type="sine", vol=0.18, delay=0){
  const ac = audioCtx(); if(!ac) return;
  const t0 = ac.currentTime + delay;
  const osc = ac.createOscillator(); const gain = ac.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(vol, t0+0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  osc.connect(gain); gain.connect(ac.destination);
  osc.start(t0); osc.stop(t0+dur+0.02);
}
function sfxCountdown(n){ beep(n===0?880:520, 0.18, "square", 0.15); }
function sfxGo(){ beep(1046,0.35,"sawtooth",0.18); beep(1318,0.3,"sawtooth",0.14,0.08); }
function sfxBoost(){ beep(220,0.25,"sawtooth",0.15); beep(660,0.2,"sine",0.12,0.05); }
function sfxLap(){ beep(784,0.15,"triangle",0.15); beep(988,0.18,"triangle",0.15,0.1); }
function sfxFinish(){ [523,659,784,1046].forEach((f,i)=>beep(f,0.3,"triangle",0.16,i*0.12)); }

// ---------- 유틸 ----------
const TAU = Math.PI*2;
function lerp(a,b,t){return a+(b-a)*t;}
function clamp(v,a,b){return Math.min(b,Math.max(a,v));}
function angDiff(a,b){ let d=(b-a+Math.PI*3)%TAU - Math.PI; return d; }
function dist(x1,y1,x2,y2){ return Math.hypot(x2-x1,y2-y1); }

// ---------- 트랙 정의 (둥근 사각형 서킷) ----------
const CX=500, CY=350, RW=680, RH=420, R=150;
const TRACK_HALF_W = 68;
const segs = (() => {
  const s = [];
  const A = {x:CX-RW/2+R, y:CY+RH/2};
  const B = {x:CX+RW/2-R, y:CY+RH/2};
  s.push({type:"line", p0:A, p1:B, len: B.x-A.x});
  s.push({type:"arc", c:{x:CX+RW/2-R, y:CY+RH/2-R}, r:R, a0:Math.PI/2, a1:0, len:(Math.PI/2)*R});
  const C = {x:CX+RW/2, y:CY+RH/2-R};
  const D = {x:CX+RW/2, y:CY-RH/2+R};
  s.push({type:"line", p0:C, p1:D, len: C.y-D.y});
  s.push({type:"arc", c:{x:CX+RW/2-R, y:CY-RH/2+R}, r:R, a0:0, a1:-Math.PI/2, len:(Math.PI/2)*R});
  const E = {x:CX+RW/2-R, y:CY-RH/2};
  const F = {x:CX-RW/2+R, y:CY-RH/2};
  s.push({type:"line", p0:E, p1:F, len: E.x-F.x});
  s.push({type:"arc", c:{x:CX-RW/2+R, y:CY-RH/2+R}, r:R, a0:-Math.PI/2, a1:-Math.PI, len:(Math.PI/2)*R});
  const G = {x:CX-RW/2, y:CY-RH/2+R};
  const Hh = {x:CX-RW/2, y:CY+RH/2-R};
  s.push({type:"line", p0:G, p1:Hh, len: Hh.y-G.y});
  s.push({type:"arc", c:{x:CX-RW/2+R, y:CY+RH/2-R}, r:R, a0:-Math.PI, a1:-Math.PI*1.5, len:(Math.PI/2)*R});
  return s;
})();
const TOTAL_LEN = segs.reduce((a,s)=>a+s.len,0);
function pointAt(s){
  s = ((s % TOTAL_LEN) + TOTAL_LEN) % TOTAL_LEN;
  let acc = 0;
  for(const seg of segs){
    if(s <= acc+seg.len || seg===segs[segs.length-1]){
      const t = seg.len>0 ? clamp((s-acc)/seg.len,0,1) : 0;
      if(seg.type==="line"){
        const x = lerp(seg.p0.x, seg.p1.x, t), y = lerp(seg.p0.y, seg.p1.y, t);
        const ang = Math.atan2(seg.p1.y-seg.p0.y, seg.p1.x-seg.p0.x);
        return {x,y,ang};
      } else {
        const a = lerp(seg.a0, seg.a1, t);
        const x = seg.c.x + seg.r*Math.cos(a), y = seg.c.y + seg.r*Math.sin(a);
        const ang = Math.atan2(-Math.cos(a), Math.sin(a));
        return {x,y,ang};
      }
    }
    acc += seg.len;
  }
  return {x:CX,y:CY,ang:0};
}
const SAMPLE_N = 420;
const samples = [];
for(let i=0;i<SAMPLE_N;i++){ samples.push(pointAt(i/SAMPLE_N*TOTAL_LEN)); }
function nearestIndex(x,y){
  let bi=0, bd=Infinity;
  for(let i=0;i<SAMPLE_N;i++){
    const d = (samples[i].x-x)**2 + (samples[i].y-y)**2;
    if(d<bd){ bd=d; bi=i; }
  }
  return {idx:bi, dist:Math.sqrt(bd)};
}
// 부스터 패드 위치 (트랙 진행도 기준)
const BOOST_S = [0.28, 0.72];
const BOOST_IDX = BOOST_S.map(f=>Math.floor(f*SAMPLE_N));

// ---------- 1인칭 카메라 투영 ----------
const EYE_HEIGHT = 55;     // 카메라(운전석) 높이
const FOCAL = 380;         // 초점거리 (클수록 좁은 시야각/줌인)
const HORIZON_Y = H*0.42;  // 지평선 화면 y좌표
const DRAW_DIST = 260;     // 전방 렌더 거리(월드 단위)
const NEAR_CLIP = 8;
function project(wx, wy, h, camX, camY, camAngle){
  const fx = Math.cos(camAngle), fy = Math.sin(camAngle);
  const rx = -Math.sin(camAngle), ry = Math.cos(camAngle);
  const relX = wx-camX, relY = wy-camY;
  const fwd = relX*fx + relY*fy;
  if(fwd < NEAR_CLIP) return null;
  const right = relX*rx + relY*ry;
  const scale = FOCAL/fwd;
  return { sx: W/2 + right*scale, sy: HORIZON_Y + (EYE_HEIGHT-h)*scale, scale, fwd };
}
function mixColor(c1,c2,t){
  t = clamp(t,0,1);
  const p1=c1, p2=c2;
  const r = Math.round(p1[0]+(p2[0]-p1[0])*t);
  const g = Math.round(p1[1]+(p2[1]-p1[1])*t);
  const b = Math.round(p1[2]+(p2[2]-p1[2])*t);
  return `rgb(${r},${g},${b})`;
}
const SKY_FOG = [58,110,160];
function fillQuad(p1,p2,p3,p4,rgb,fogT){
  ctx.fillStyle = mixColor(rgb, SKY_FOG, fogT*fogT);
  ctx.beginPath();
  ctx.moveTo(p1.sx,p1.sy); ctx.lineTo(p2.sx,p2.sy); ctx.lineTo(p3.sx,p3.sy); ctx.lineTo(p4.sx,p4.sy);
  ctx.closePath(); ctx.fill();
}
const trackBB = (()=>{
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(const s of samples){ minX=Math.min(minX,s.x); maxX=Math.max(maxX,s.x); minY=Math.min(minY,s.y); maxY=Math.max(maxY,s.y); }
  return {minX,maxX,minY,maxY};
})();
const TREE_SPOTS = [30,70,120,170,220,270,320,370].map(i=>i%SAMPLE_N);

// ---------- 캐릭터 ----------
const CHARACTERS = [
  {id:"fox",  name:"여우 레이서",  emoji:"🦊", color:"#ff8a3d", color2:"#ff5d00"},
  {id:"cat",  name:"냥냥 스피드",  emoji:"🐱", color:"#b98bff", color2:"#7b3dff"},
  {id:"bear", name:"곰돌 파워",    emoji:"🐻", color:"#c98a5b", color2:"#8a5a2e"},
  {id:"bunny",name:"토깽 점프",    emoji:"🐰", color:"#ff8fd0", color2:"#ff3d9e"},
  {id:"panda",name:"판다 드리프트",emoji:"🐼", color:"#e9e9e9", color2:"#333333"},
  {id:"frog", name:"개굴 부스터",  emoji:"🐸", color:"#7be08a", color2:"#2e9e4a"},
];

// ---------- 상태 ----------
const LAPS = 3;
let racers = [];       // 4대: player + AI 3
let playerIdx = 0;
let raceState = "idle"; // idle | countdown | racing | finished
let raceTime = 0;
let particles = [];
let camShake = 0;
let selectedChar = null;
const keys = {};

function makeRacer(charDef, isPlayer, gridPos){
  const startPt = samples[0];
  const normal = {x:Math.sin(startPt.ang), y:-Math.cos(startPt.ang)};
  const lane = [-42,-14,14,42][gridPos];
  return {
    char: charDef, isPlayer,
    x: startPt.x + normal.x*lane - Math.cos(startPt.ang)*gridPos*26,
    y: startPt.y + normal.y*lane - Math.sin(startPt.ang)*gridPos*26,
    angle: startPt.ang, speed: 0, steerVisual:0,
    lastIdx: 0, lap: 0, finished:false, finishTime:0,
    boostT: 0, offTrack:false, aiTargetOffset: lerp(-38,38, Math.random()),
    smokeCooldown:0, place:1, totalProgress:0,
  };
}

function resetRace(){
  racers = [];
  const shuffledChars = [...CHARACTERS].sort(()=>Math.random()-0.5);
  const chosen = [selectedChar, ...shuffledChars.filter(c=>c.id!==selectedChar.id).slice(0,3)];
  for(let i=0;i<4;i++){
    racers.push(makeRacer(chosen[i], i===0, i));
  }
  playerIdx = 0;
  raceTime = 0;
  particles = [];
  raceState = "countdown";
  startCountdown();
}

// ---------- 물리 ----------
const MAX_SPEED = 260;
const ACCEL = 230;
const BRAKE = 420;
const FRICTION = 150;
const TURN_RATE = 3.0;

function updateCar(car, input, dt){
  if(car.finished){ car.speed *= 0.9; }
  else {
    if(input.throttle>0) car.speed += ACCEL*dt*input.throttle;
    else if(input.throttle<0) car.speed += BRAKE*dt*input.throttle;
    else {
      if(car.speed>0) car.speed = Math.max(0, car.speed - FRICTION*dt);
      else car.speed = Math.min(0, car.speed + FRICTION*dt);
    }
  }
  const boostMul = car.boostT>0 ? 1.55 : 1;
  const trackMul = car.offTrack ? 0.55 : 1;
  const capSpeed = MAX_SPEED*boostMul*trackMul;
  car.speed = clamp(car.speed, -MAX_SPEED*0.5, capSpeed);

  car.steerVisual = lerp(car.steerVisual, input.steer, 0.18);
  const speedFactor = 0.35 + 0.65*clamp(Math.abs(car.speed)/MAX_SPEED,0,1);
  const dirMul = car.speed<0 ? -1 : 1;
  car.angle += input.steer*TURN_RATE*speedFactor*dirMul*dt;

  car.x += Math.cos(car.angle)*car.speed*dt;
  car.y += Math.sin(car.angle)*car.speed*dt;

  if(car.boostT>0) car.boostT -= dt;
  if(car.smokeCooldown>0) car.smokeCooldown -= dt;

  const near = nearestIndex(car.x, car.y);
  car.offTrack = near.dist > TRACK_HALF_W;

  let idxDelta = near.idx - car.lastIdx;
  if(idxDelta < -SAMPLE_N*0.5) { car.lap += 1; if(car.isPlayer) sfxLap(); }
  else if(idxDelta > SAMPLE_N*0.5) { car.lap -= 1; }
  car.lastIdx = near.idx;
  car.totalProgress = car.lap*SAMPLE_N + near.idx;

  if(!car.finished && car.lap >= LAPS){
    car.finished = true;
    car.finishTime = raceTime;
  }

  const bIdx = near.idx;
  for(const bi of BOOST_IDX){
    if(Math.abs(bIdx-bi) < 5 && car.boostT<=0 && Math.abs(car.speed)>20){
      car.boostT = 1.1;
      spawnBoostBurst(car);
      if(car.isPlayer) sfxBoost();
    }
  }

  if(Math.abs(input.steer)>0.5 && Math.abs(car.speed)>120 && car.smokeCooldown<=0){
    spawnSmoke(car);
    car.smokeCooldown = 0.05;
  }
}

function aiInput(car){
  const near = nearestIndex(car.x, car.y);
  const lookahead = clamp(6 + Math.floor(Math.abs(car.speed)/22), 6, 26);
  const targetSample = samples[(near.idx+lookahead)%SAMPLE_N];
  const normal = {x:Math.sin(targetSample.ang), y:-Math.cos(targetSample.ang)};
  const tx = targetSample.x + normal.x*car.aiTargetOffset;
  const ty = targetSample.y + normal.y*car.aiTargetOffset;
  const desiredAng = Math.atan2(ty-car.y, tx-car.x);
  const diff = angDiff(car.angle, desiredAng);
  const steer = clamp(diff*1.6, -1, 1);
  const sharp = clamp(1-Math.abs(diff)*1.1, 0.35, 1);
  let throttle = sharp;

  // 러버밴딩: 플레이어와 격차 조정
  const player = racers[playerIdx];
  if(player && player!==car){
    const gap = car.totalProgress - player.totalProgress;
    if(gap > 40) throttle *= 0.82;
    else if(gap < -60) throttle *= 1.12;
  }
  return {throttle: clamp(throttle,0,1), steer};
}

function playerInput(){
  let steer = 0, throttle = 0;
  if(keys["ArrowLeft"]||keys["a"]||keys["A"]) steer -= 1;
  if(keys["ArrowRight"]||keys["d"]||keys["D"]) steer += 1;
  if(keys["ArrowUp"]||keys["w"]||keys["W"]) throttle += 1;
  if(keys["ArrowDown"]||keys["s"]||keys["S"]) throttle -= 1;
  return {throttle, steer};
}

// ---------- 파티클 ----------
function spawnSmoke(car){
  const backX = car.x - Math.cos(car.angle)*16, backY = car.y - Math.sin(car.angle)*16;
  particles.push({x:backX,y:backY,vx:(Math.random()-0.5)*20,vy:(Math.random()-0.5)*20,life:0.5,maxLife:0.5,size:6+Math.random()*4,color:"200,200,210",type:"smoke"});
}
function spawnBoostBurst(car){
  for(let i=0;i<14;i++){
    const a = Math.random()*TAU;
    particles.push({x:car.x,y:car.y,vx:Math.cos(a)*80,vy:Math.sin(a)*80,life:0.5,maxLife:0.5,size:3+Math.random()*3,color:"255,210,63",type:"spark"});
  }
}
function spawnConfetti(){
  const colors=["255,210,63","255,93,162","61,220,151","125,224,255"];
  for(let i=0;i<60;i++){
    particles.push({x:Math.random()*W,y:-10,vx:(Math.random()-0.5)*40,vy:80+Math.random()*80,life:3,maxLife:3,size:4+Math.random()*4,
      color:colors[i%colors.length],type:"confetti",rot:Math.random()*TAU,rotSpeed:(Math.random()-0.5)*6});
  }
}
function updateParticles(dt){
  for(const p of particles){
    p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt;
    if(p.type==="confetti"){ p.vy += 40*dt; p.rot += p.rotSpeed*dt; }
    if(p.type==="smoke"){ p.size += 14*dt; }
  }
  particles = particles.filter(p=>p.life>0);
}
function drawParticlesWorld(camX,camY,camAngle){
  for(const p of particles){
    if(p.type==="confetti") continue;
    const proj = project(p.x,p.y, p.size*0.5, camX,camY,camAngle);
    if(!proj || proj.fwd>DRAW_DIST*1.2) continue;
    const a = clamp(p.life/p.maxLife,0,1);
    ctx.save();
    ctx.globalAlpha = a*(p.type==="smoke"?0.35:1);
    ctx.fillStyle = `rgb(${p.color})`;
    ctx.beginPath(); ctx.arc(proj.sx,proj.sy, p.size*proj.scale*0.5, 0, TAU); ctx.fill();
    ctx.restore();
  }
}
function drawParticlesScreen(){
  for(const p of particles){
    if(p.type!=="confetti") continue;
    const a = clamp(p.life/p.maxLife,0,1);
    ctx.save();
    ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    ctx.fillStyle = `rgba(${p.color},${a})`;
    ctx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);
    ctx.restore();
  }
}

// ---------- 렌더 (1인칭 의사-3D) ----------
let bgPulse = 0;
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawSky(dt, camAngle){
  bgPulse += dt;
  const g = ctx.createLinearGradient(0,0,0,HORIZON_Y+20);
  g.addColorStop(0, "#1c2b6b");
  g.addColorStop(0.6, "#3a6ea8");
  g.addColorStop(1, "#8fc6dd");
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,HORIZON_Y+20);

  // 태양
  ctx.save();
  ctx.globalAlpha = 0.9;
  const sunX = W*0.78, sunY = HORIZON_Y*0.35;
  const sunGrad = ctx.createRadialGradient(sunX,sunY,4,sunX,sunY,60);
  sunGrad.addColorStop(0,"#fff6cf"); sunGrad.addColorStop(1,"rgba(255,246,207,0)");
  ctx.fillStyle = sunGrad;
  ctx.beginPath(); ctx.arc(sunX,sunY,60,0,TAU); ctx.fill();
  ctx.restore();

  // 흘러가는 구름 (진행 방향에 따라 살짝 패럴랙스)
  ctx.save();
  ctx.globalAlpha = 0.22;
  const parallax = camAngle*40;
  for(let i=0;i<6;i++){
    const cx = (((bgPulse*8 - parallax) + i*220) % (W+240)) - 120;
    const cy = HORIZON_Y*0.25 + (i%3)*26;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.ellipse(cx,cy,46,16,0,0,TAU);
    ctx.ellipse(cx+34,cy+5,28,12,0,0,TAU);
    ctx.fill();
  }
  ctx.restore();

  // 지평선 라인 살짝 강조
  ctx.fillStyle = "#2f5f46";
  ctx.fillRect(0,HORIZON_Y-1,W,3);
}

function drawGroundBase(){
  const g = ctx.createLinearGradient(0,HORIZON_Y,0,H);
  g.addColorStop(0,"#3a8f5c");
  g.addColorStop(1,"#1f6b3f");
  ctx.fillStyle = g;
  ctx.fillRect(0,HORIZON_Y,W,H-HORIZON_Y);
}

function drawRoad(camX,camY,camAngle){
  const near = nearestIndex(camX,camY);
  const spacing = TOTAL_LEN/SAMPLE_N;
  const count = Math.min(SAMPLE_N-2, Math.ceil(DRAW_DIST/spacing)+3);
  const pts = [];
  for(let k=0;k<=count;k++){
    const idx = (near.idx+k)%SAMPLE_N;
    const s = samples[idx];
    const nx = Math.sin(s.ang), ny = -Math.cos(s.ang);
    const left = project(s.x+nx*TRACK_HALF_W, s.y+ny*TRACK_HALF_W, 0, camX,camY,camAngle);
    const right = project(s.x-nx*TRACK_HALF_W, s.y-ny*TRACK_HALF_W, 0, camX,camY,camAngle);
    const curbL = project(s.x+nx*(TRACK_HALF_W+9), s.y+ny*(TRACK_HALF_W+9), 0, camX,camY,camAngle);
    const curbR = project(s.x-nx*(TRACK_HALF_W+9), s.y-ny*(TRACK_HALF_W+9), 0, camX,camY,camAngle);
    const fwd = left ? left.fwd : (right ? right.fwd : -1);
    pts.push({idx,left,right,curbL,curbR,fwd});
  }
  for(let k=count-1;k>=0;k--){
    const a = pts[k+1], b = pts[k];
    if(!a.left||!a.right||!b.left||!b.right||!a.curbL||!a.curbR||!b.curbL||!b.curbR) continue;
    if(a.fwd>DRAW_DIST*1.15) continue;
    const fogT = clamp(((a.fwd+b.fwd)*0.5)/DRAW_DIST, 0, 1);
    const band = Math.floor(a.idx/4)%2===0;
    const isBoost = BOOST_IDX.some(bi=>Math.abs(a.idx-bi)<6 || Math.abs(b.idx-bi)<6);
    const isFinish = Math.abs(a.idx-0)<4 || Math.abs(b.idx-0)<4 || a.idx>SAMPLE_N-4 || b.idx>SAMPLE_N-4;

    // 커브(연석)
    fillQuad(a.curbL,a.left,b.left,b.curbL, band?[230,60,60]:[240,240,240], fogT);
    fillQuad(a.curbR,a.right,b.right,b.curbR, band?[240,240,240]:[230,60,60], fogT);

    // 도로
    let roadColor = band ? [58,62,80] : [70,75,98];
    if(isBoost) roadColor = [255,196,40];
    if(isFinish) roadColor = band ? [235,235,235] : [30,30,30];
    fillQuad(a.left,a.right,b.right,b.left, roadColor, fogT);

    // 중앙 점선
    if(band && !isFinish){
      const midA = {sx:(a.left.sx+a.right.sx)/2 - (a.left.sx-a.right.sx)*0.06, sy:(a.left.sy+a.right.sy)/2};
      const midA2 = {sx:(a.left.sx+a.right.sx)/2 + (a.left.sx-a.right.sx)*0.06, sy:(a.left.sy+a.right.sy)/2};
      const midB = {sx:(b.left.sx+b.right.sx)/2 - (b.left.sx-b.right.sx)*0.06, sy:(b.left.sy+b.right.sy)/2};
      const midB2 = {sx:(b.left.sx+b.right.sx)/2 + (b.left.sx-b.right.sx)*0.06, sy:(b.left.sy+b.right.sy)/2};
      fillQuad(midA,midA2,midB2,midB, [255,255,255], fogT);
    }
  }
}

function drawTreeSprite(idx, camX,camY,camAngle){
  const s = samples[idx%SAMPLE_N];
  const nx = Math.sin(s.ang), ny=-Math.cos(s.ang);
  const outward = TRACK_HALF_W + 42;
  const wx = s.x+nx*outward, wy = s.y+ny*outward;
  const base = project(wx,wy,0,camX,camY,camAngle);
  if(!base || base.fwd>DRAW_DIST*1.3) return;
  const sc = base.scale;
  ctx.save();
  ctx.globalAlpha = 1-clamp(base.fwd/(DRAW_DIST*1.3),0,1)*0.5;
  ctx.fillStyle="#00000030";
  ctx.beginPath(); ctx.ellipse(base.sx, base.sy+2*sc, 16*sc,5*sc,0,0,TAU); ctx.fill();
  ctx.fillStyle="#6b4a2b";
  ctx.fillRect(base.sx-3*sc, base.sy-18*sc, 6*sc, 18*sc);
  ctx.fillStyle="#3fae63";
  ctx.beginPath(); ctx.arc(base.sx, base.sy-30*sc, 18*sc,0,TAU); ctx.fill();
  ctx.fillStyle="#57cf80";
  ctx.beginPath(); ctx.arc(base.sx-6*sc, base.sy-37*sc, 11*sc,0,TAU); ctx.fill();
  ctx.restore();
}

function drawBoostStar(idx, camX,camY,camAngle){
  const s = samples[idx];
  const bob = 26+Math.sin(bgPulse*5)*5;
  const p = project(s.x, s.y, bob, camX,camY,camAngle);
  if(!p || p.fwd>DRAW_DIST*1.1) return;
  ctx.save();
  ctx.globalAlpha = 0.5+0.5*Math.sin(bgPulse*6);
  ctx.font = `${28*p.scale}px sans-serif`;
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText("⭐", p.sx, p.sy);
  ctx.restore();
}

function drawFinishGate(camX,camY,camAngle){
  const s = samples[0];
  const nx = Math.sin(s.ang), ny=-Math.cos(s.ang);
  const leftBase = {x:s.x+nx*TRACK_HALF_W, y:s.y+ny*TRACK_HALF_W};
  const rightBase = {x:s.x-nx*TRACK_HALF_W, y:s.y-ny*TRACK_HALF_W};
  const stripes = 8;
  for(let i=0;i<stripes;i++){
    const t0=i/stripes, t1=(i+1)/stripes;
    const x0 = lerp(leftBase.x,rightBase.x,t0), y0 = lerp(leftBase.y,rightBase.y,t0);
    const x1 = lerp(leftBase.x,rightBase.x,t1), y1 = lerp(leftBase.y,rightBase.y,t1);
    const p0top = project(x0,y0,130,camX,camY,camAngle), p1top = project(x1,y1,130,camX,camY,camAngle);
    const p0bot = project(x0,y0,105,camX,camY,camAngle), p1bot = project(x1,y1,105,camX,camY,camAngle);
    if(!p0top||!p1top||!p0bot||!p1bot) continue;
    fillQuad(p0top,p1top,p1bot,p0bot, i%2===0?[245,245,245]:[20,20,20], 0);
  }
  // 기둥
  for(const base of [leftBase,rightBase]){
    const top = project(base.x,base.y,132,camX,camY,camAngle);
    const bot = project(base.x,base.y,0,camX,camY,camAngle);
    if(!top||!bot) continue;
    ctx.strokeStyle="#ffd23f"; ctx.lineWidth = Math.max(2,6*bot.scale); ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(top.sx,top.sy); ctx.lineTo(bot.sx,bot.sy); ctx.stroke();
  }
}

function drawKartBillboard(car, camX,camY,camAngle){
  const p = project(car.x, car.y, 0, camX,camY,camAngle);
  if(!p || p.fwd>DRAW_DIST*1.2) return;
  const sc = p.scale;
  const fog = clamp(p.fwd/(DRAW_DIST*1.2),0,1);
  ctx.save();
  ctx.globalAlpha = 1-fog*0.6;
  // 그림자
  ctx.fillStyle = "#00000040";
  ctx.beginPath(); ctx.ellipse(p.sx, p.sy, 20*sc, 8*sc, 0,0,TAU); ctx.fill();

  const bodyW = 40*sc, bodyH = 24*sc;
  const bodyTop = p.sy - bodyH*1.1;
  // 부스트 화염
  if(car.boostT>0){
    ctx.fillStyle = "rgba(255,170,40,0.7)";
    ctx.beginPath();
    ctx.ellipse(p.sx, p.sy-bodyH*0.4, bodyW*0.5, bodyH*0.7, 0,0,TAU);
    ctx.fill();
  }
  // 바퀴
  ctx.fillStyle="#222";
  ctx.fillRect(p.sx-bodyW/2-3*sc, p.sy-6*sc, 8*sc, 10*sc);
  ctx.fillRect(p.sx+bodyW/2-5*sc, p.sy-6*sc, 8*sc, 10*sc);
  // 본체
  const grad = ctx.createLinearGradient(p.sx-bodyW/2,0,p.sx+bodyW/2,0);
  grad.addColorStop(0, car.char.color2); grad.addColorStop(1, car.char.color);
  ctx.fillStyle = grad;
  roundRect(p.sx-bodyW/2, bodyTop, bodyW, bodyH, 8*sc);
  ctx.fill();
  ctx.fillStyle="#ffffff55";
  roundRect(p.sx-bodyW*0.32, bodyTop+bodyH*0.12, bodyW*0.64, bodyH*0.28, 4*sc);
  ctx.fill();
  // 얼굴
  ctx.font = `${26*sc}px sans-serif`;
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.shadowColor="#000a"; ctx.shadowBlur=3*sc;
  ctx.fillText(car.char.emoji, p.sx, bodyTop-6*sc);
  ctx.restore();
}

function drawHood(player){
  // 화면 하단 고정 대시보드 + 캐릭터 (진짜 1인칭 느낌 + 귀여움 유지)
  const bob = Math.sin(bgPulse*10)*clamp(Math.abs(player.speed)/MAX_SPEED,0,1)*1.5;
  const lean = clamp(player.steerVisual,-1,1)*10;
  ctx.save();
  ctx.translate(0,bob);
  const grad = ctx.createLinearGradient(0,H-120,0,H);
  grad.addColorStop(0, player.char.color2+"cc");
  grad.addColorStop(1, player.char.color2);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(0,H);
  ctx.lineTo(0,H-40);
  ctx.quadraticCurveTo(W*0.5, H-100+lean*0.3, W, H-40);
  ctx.lineTo(W,H);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = "#ffffff22";
  ctx.beginPath();
  ctx.moveTo(W*0.5-90,H-46);
  ctx.quadraticCurveTo(W*0.5, H-70+lean*0.3, W*0.5+90, H-46);
  ctx.lineTo(W*0.5+90,H-30);
  ctx.quadraticCurveTo(W*0.5,H-52,W*0.5-90,H-30);
  ctx.closePath();
  ctx.fill();

  // 핸들
  ctx.save();
  ctx.translate(W*0.5, H-14);
  ctx.rotate(lean*0.03);
  ctx.strokeStyle="#20242f"; ctx.lineWidth=10; ctx.lineCap="round";
  ctx.beginPath(); ctx.arc(0,0,46,Math.PI*0.15,Math.PI*0.85); ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,46,Math.PI*1.15,Math.PI*1.85); ctx.stroke();
  ctx.fillStyle="#20242f"; ctx.beginPath(); ctx.arc(0,0,10,0,TAU); ctx.fill();
  ctx.restore();

  // 캐릭터 얼굴이 핸들 위로 살짝
  ctx.font = "40px sans-serif";
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.save();
  ctx.shadowColor="#000a"; ctx.shadowBlur=6;
  ctx.fillText(player.char.emoji, W*0.5, H-64+lean*0.15);
  ctx.restore();
  ctx.restore();
}

function drawSpeedLines(player){
  if(player.boostT<=0) return;
  ctx.save();
  ctx.globalAlpha = 0.35;
  ctx.strokeStyle = "#ffffff";
  const cx=W/2, cy=HORIZON_Y+40;
  for(let i=0;i<18;i++){
    const a = Math.random()*TAU;
    const r0 = 30+Math.random()*20, r1=r0+120+Math.random()*140;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*r0, cy+Math.sin(a)*r0*0.5);
    ctx.lineTo(cx+Math.cos(a)*r1, cy+Math.sin(a)*r1*0.5);
    ctx.lineWidth = 1+Math.random()*1.5;
    ctx.stroke();
  }
  ctx.restore();
}

function drawMinimap(){
  const mmW=170, mmH=110, mx=W-mmW-14, my=H-mmH-14, pad=14;
  ctx.save();
  ctx.fillStyle="rgba(10,14,30,0.92)"; ctx.strokeStyle="#ffffff55"; ctx.lineWidth=1.5;
  roundRect(mx,my,mmW,mmH,12); ctx.fill(); ctx.stroke();
  const sc = Math.min((mmW-2*pad)/(trackBB.maxX-trackBB.minX), (mmH-2*pad)/(trackBB.maxY-trackBB.minY));
  const toMap = (wx,wy)=>({x:mx+pad+(wx-trackBB.minX)*sc, y:my+pad+(wy-trackBB.minY)*sc});
  ctx.beginPath();
  samples.forEach((s,i)=>{ const p=toMap(s.x,s.y); if(i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); });
  ctx.closePath();
  ctx.strokeStyle="#ffffff90"; ctx.lineWidth=4; ctx.stroke();
  for(const car of racers){
    const p = toMap(car.x,car.y);
    ctx.beginPath();
    ctx.fillStyle = car.isPlayer ? "#ffd23f" : car.char.color;
    ctx.arc(p.x,p.y, car.isPlayer?5.5:3.5, 0, TAU);
    ctx.fill();
    if(car.isPlayer){ ctx.strokeStyle="#fff"; ctx.lineWidth=1.5; ctx.stroke(); }
  }
  ctx.restore();
}

function renderScene(player, dt){
  const camAngle = player.angle;
  const camX = player.x - Math.cos(camAngle)*8;
  const camY = player.y - Math.sin(camAngle)*8;

  const bank = clamp(player.steerVisual,-1,1) * 0.045;
  ctx.save();
  if(camShake>0){
    ctx.translate((Math.random()-0.5)*camShake, (Math.random()-0.5)*camShake);
  }
  ctx.translate(W/2,H*0.55); ctx.rotate(bank); ctx.translate(-W/2,-H*0.55);

  drawSky(dt, camAngle);
  drawGroundBase();
  drawRoad(camX,camY,camAngle);
  drawFinishGate(camX,camY,camAngle);
  for(const idx of TREE_SPOTS) drawTreeSprite(idx, camX,camY,camAngle);
  for(const bi of BOOST_IDX) drawBoostStar(bi, camX,camY,camAngle);

  const others = racers.filter(c=>c!==player)
    .map(c=>({c, fwd: (() => { const p = project(c.x,c.y,0,camX,camY,camAngle); return p?p.fwd:-1; })()}))
    .filter(o=>o.fwd>0)
    .sort((a,b)=>b.fwd-a.fwd);
  for(const o of others) drawKartBillboard(o.c, camX,camY,camAngle);

  drawParticlesWorld(camX,camY,camAngle);
  drawSpeedLines(player);
  ctx.restore();

  drawHood(player);
  drawMinimap();
  drawParticlesScreen();
}

function updateRanks(){
  const sorted = [...racers].sort((a,b)=>b.totalProgress-a.totalProgress);
  sorted.forEach((r,i)=>r.place=i+1);
}

window.addEventListener("keydown", e=>{ keys[e.key]=true; });
window.addEventListener("keyup", e=>{ keys[e.key]=false; });

function bindTouch(id, key){
  const el = document.getElementById(id);
  const on = (e)=>{ e.preventDefault(); keys[key]=true; };
  const off = (e)=>{ e.preventDefault(); keys[key]=false; };
  el.addEventListener("touchstart", on, {passive:false});
  el.addEventListener("touchend", off, {passive:false});
  el.addEventListener("touchcancel", off, {passive:false});
}
bindTouch("tLeft","ArrowLeft");
bindTouch("tRight","ArrowRight");
bindTouch("tGas","ArrowUp");
bindTouch("tBrake","ArrowDown");

function startCountdown(){
  let n = 3;
  countdownEl.classList.remove("hidden");
  countdownEl.textContent = n;
  sfxCountdown(n);
  const iv = setInterval(()=>{
    n--;
    if(n>0){ countdownEl.textContent = n; sfxCountdown(n); }
    else if(n===0){ countdownEl.textContent = "GO!"; sfxGo(); }
    else {
      clearInterval(iv);
      countdownEl.classList.add("hidden");
      raceState = "racing";
    }
  }, 800);
}

function fmtTime(t){
  const m = Math.floor(t/60);
  const s = (t%60).toFixed(1).padStart(4,"0");
  return `${String(m).padStart(2,"0")}:${s}`;
}

function showResults(){
  raceState = "finished";
  hud.classList.add("hidden");
  touchCtl.classList.add("hidden");
  spawnConfetti();
  sfxFinish();
  const sorted = [...racers].sort((a,b)=>{
    if(a.finished && b.finished) return a.finishTime-b.finishTime;
    if(a.finished) return -1;
    if(b.finished) return 1;
    return b.totalProgress-a.totalProgress;
  });
  const tbl = document.getElementById("resultTable");
  const medal = ["🥇","🥈","🥉","4️⃣"];
  let html = "<tr><th>순위</th><th>캐릭터</th><th>기록</th></tr>";
  sorted.forEach((r,i)=>{
    html += `<tr class="${r.isPlayer?'me':''}"><td>${medal[i]}</td><td>${r.char.emoji} ${r.char.name}${r.isPlayer?' (나)':''}</td><td>${r.finished?fmtTime(r.finishTime):'-'}</td></tr>`;
  });
  tbl.innerHTML = html;
  const you = sorted.findIndex(r=>r.isPlayer)+1;
  document.getElementById("resultTitle").textContent = you===1 ? "🏆 우승 축하해요! 🏆" : `레이스 종료! 당신은 ${you}등`;
  screenResult.classList.remove("hidden");
}

// ---------- 메인 루프 ----------
let lastT = performance.now();
function loop(now){
  const dt = Math.min(0.033, (now-lastT)/1000);
  lastT = now;

  if(raceState==="racing" || raceState==="countdown"){
    if(raceState==="racing") raceTime += dt;
    for(const car of racers){
      const wasOff = car.offTrack;
      const input = car.isPlayer ? (raceState==="racing"?playerInput():{throttle:0,steer:0}) : (raceState==="racing"?aiInput(car):{throttle:0,steer:0});
      updateCar(car, input, dt);
      if(car.isPlayer && car.offTrack && !wasOff) camShake = 5;
    }
    updateRanks();
    if(raceState==="racing" && racers[playerIdx].finished){
      showResults();
    }
  }
  if(camShake>0) camShake = Math.max(0, camShake-dt*20);

  updateParticles(dt);
  renderScene(racers[playerIdx] || makeRacer(CHARACTERS[0], true, 0), dt);

  if(raceState==="racing" || raceState==="countdown"){
    const p = racers[playerIdx];
    document.getElementById("lapNow").textContent = Math.min(p.lap+1, LAPS);
    document.getElementById("timeBox").textContent = fmtTime(raceTime);
    document.getElementById("rankNum").textContent = p.place;
    document.getElementById("rankSuffix").textContent = p.place===1?"st":p.place===2?"nd":p.place===3?"rd":"th";
    const spd = clamp(Math.abs(p.speed)/MAX_SPEED,0,1);
    document.getElementById("speedFill").style.width = (spd*100)+"%";
    document.getElementById("boostText").style.opacity = p.boostT>0 ? 1 : 0;
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
